<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>크레딧 채권 매매 대시보드</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background-color: #f4f5f7;
    color: #172b4d;
  }

  header {
    padding: 20px 32px;
    background-color: #0b1f3a;
    color: #ffffff;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }

  header h1 {
    margin: 0;
    font-size: 20px;
  }

  header .as-of {
    font-size: 13px;
    color: #b7c3d9;
  }

  main {
    padding: 24px 32px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .panel {
    background-color: #ffffff;
    border: 1px solid #dfe1e6;
    border-radius: 10px;
    padding: 18px 20px;
  }

  .panel h2 {
    font-size: 15px;
    margin: 0 0 14px 0;
    color: #172b4d;
  }

  .rate-cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }

  .rate-card {
    background-color: #f4f5f7;
    border-radius: 8px;
    padding: 14px 16px;
  }

  .rate-card .tenor {
    font-size: 13px;
    color: #44546f;
  }

  .rate-card .value {
    font-size: 24px;
    font-weight: 700;
    margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }

  .rate-card .change {
    font-size: 13px;
    margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }

  .change.up { color: #d64545; }
  .change.down { color: #2563eb; }
  .change.flat { color: #6b778c; }

  .grid-2 {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 20px;
    align-items: start;
  }

  .col {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .tab-row {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }

  .tab-btn {
    border: 1px solid #dfe1e6;
    background-color: #ffffff;
    border-radius: 6px;
    padding: 6px 14px;
    font-size: 13px;
    cursor: pointer;
    color: #44546f;
  }

  .tab-btn.active {
    background-color: #0b1f3a;
    border-color: #0b1f3a;
    color: #ffffff;
  }

  .chart-wrap {
    position: relative;
    height: 280px;
  }

  .chart-wrap.short {
    height: 220px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  th, td {
    text-align: left;
    padding: 8px 6px;
    border-bottom: 1px solid #ebecf0;
  }

  th {
    color: #6b778c;
    font-weight: 600;
    font-size: 12px;
  }

  td.num {
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .event-list, .opinion-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .event-item, .opinion-item {
    padding: 10px 12px;
    background-color: #f4f5f7;
    border-radius: 8px;
    font-size: 13px;
  }

  .event-item .issuer, .opinion-item .title {
    font-weight: 600;
    margin-bottom: 4px;
  }

  .event-item .meta, .opinion-item .meta {
    color: #6b778c;
    font-size: 12px;
    margin-bottom: 4px;
  }

  .tag {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    margin-right: 6px;
  }

  .tag.up { background-color: #ffebe6; color: #d64545; }
  .tag.down { background-color: #e6f0ff; color: #2563eb; }

  @media (max-width: 960px) {
    .grid-2 {
      grid-template-columns: 1fr;
    }
    .rate-cards {
      grid-template-columns: repeat(2, 1fr);
    }
  }
</style>
</head>
<body>

<header>
  <h1>크레딧 채권 매매 대시보드</h1>
  <span class="as-of">기준일: 2026-09-23 (장 마감) · 데이터: 임시 데이터, 추후 실제 시장 데이터로 교체 예정 · 참고: 금융투자협회 채권정보센터(KOFIA BIS)</span>
</header>

<main>

  <section class="panel">
    <h2>국고채 최종호가수익률</h2>
    <div class="rate-cards" id="rate-cards"></div>
  </section>

  <div class="grid-2">
    <div class="col">
      <section class="panel">
        <h2>스프레드 추이</h2>
        <div class="tab-row" id="spread-tabs">
          <button class="tab-btn active" data-mode="sector">섹터별</button>
          <button class="tab-btn" data-mode="grade">등급별</button>
          <button class="tab-btn" data-mode="period">투자기간별</button>
        </div>
        <div class="chart-wrap">
          <canvas id="spread-chart"></canvas>
        </div>
      </section>

      <section class="panel">
        <h2>섹터별 유통 물량</h2>
        <div class="chart-wrap short">
          <canvas id="volume-chart"></canvas>
        </div>
      </section>
    </div>

    <div class="col">
      <section class="panel">
        <h2>전일 크레딧 매매 Top 5 (발행자 기준)</h2>
        <table>
          <thead>
            <tr>
              <th>발행자</th>
              <th>등급</th>
              <th class="num">매매금액(억원)</th>
              <th class="num">건수</th>
            </tr>
          </thead>
          <tbody id="top-trades-body"></tbody>
        </table>
      </section>

      <section class="panel">
        <h2>크레딧 이벤트</h2>
        <div class="event-list" id="credit-events"></div>
      </section>

      <section class="panel">
        <h2>주요 투자의견</h2>
        <div class="opinion-list" id="investment-opinions"></div>
      </section>
    </div>
  </div>

</main>

<script>
  // Supabase anon key는 Row Level Security(읽기 전용 정책)로 보호되므로 클라이언트 코드에 그대로 둡니다.
  // 쓰기 권한이 있는 service_role 키는 절대 여기에 넣지 않습니다 (scripts/collect-kofia.mjs 쪽 .env에서만 사용).
  const SUPABASE_URL = 'https://yhawlnfynxtbschjbzac.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InloYXdsbmZ5bnh0YnNjaGpiemFjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxNDQyODAsImV4cCI6MjEwNTcyMDI4MH0.3aGHs4yxtCxtnsN0b4-wtNWS71bZQVJeJ_fv-te-JNI';

  const TENOR_ORDER = ['국고채 3년', '국고채 5년', '국고채 10년', '국고채 30년'];

  async function fetchFinalQuoteRates() {
    const url = `${SUPABASE_URL}/rest/v1/kofia_rates?select=tenor,rate,change_bp&order=tenor`;
    const res = await fetch(url, {
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
      },
    });

    if (!res.ok) {
      throw new Error(`Supabase 조회 실패: ${res.status}`);
    }

    const rows = await res.json();
    const byTenor = Object.fromEntries(rows.map((r) => [r.tenor, r]));

    return TENOR_ORDER.filter((t) => byTenor[t]).map((t) => ({
      tenor: t,
      rate: Number(byTenor[t].rate),
      changeBp: Number(byTenor[t].change_bp),
    }));
  }

  // KOFIA '일자별 거래현황'(Top5 매매와 동일 소스)에서 계산한 국고채 대비 스프레드(최근 7영업일)를 읽어온다.
  // 섹터 구분은 KOFIA의 채권종류 분류(국채/지방채/특수채/통안증권/은행채/기타금융채/회사채/ABS)를 그대로 사용한다.
  const CHART_COLORS = ['#2563eb', '#059669', '#d97706', '#7c3aed', '#dc2626', '#0891b2', '#db2777', '#65a30d'];

  async function fetchSpreads() {
    const url = `${SUPABASE_URL}/rest/v1/spreads?select=trade_date,category_type,category_name,spread_bp&order=trade_date.asc`;
    const res = await fetch(url, {
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` },
    });
    if (!res.ok) throw new Error(`Supabase 조회 실패: ${res.status}`);
    const rows = await res.json();

    const dates = Array.from(new Set(rows.map((r) => r.trade_date))).sort();
    const byType = { sector: {}, grade: {}, period: {} };
    for (const row of rows) {
      const bucket = byType[row.category_type];
      if (!bucket) continue;
      if (!bucket[row.category_name]) bucket[row.category_name] = {};
      bucket[row.category_name][row.trade_date] = Number(row.spread_bp);
    }

    const datasets = {};
    for (const type of Object.keys(byType)) {
      const names = Object.keys(byType[type]).sort();
      datasets[type] = names.map((name, i) => ({
        name,
        color: CHART_COLORS[i % CHART_COLORS.length],
        data: dates.map((d) => byType[type][name][d] ?? null),
      }));
    }

    return { dates: dates.map((d) => d.slice(5).replace('-', '/')), datasets };
  }

  // KOFIA '일자별 거래현황'에서 집계한 전영업일 섹터별(채권종류별) 유통 물량을 읽어온다 (단위: 조원).
  async function fetchSectorVolume() {
    const url = `${SUPABASE_URL}/rest/v1/sector_volume?select=trade_date,sector,volume_jo&order=trade_date.desc`;
    const res = await fetch(url, {
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` },
    });
    if (!res.ok) throw new Error(`Supabase 조회 실패: ${res.status}`);
    const rows = await res.json();
    if (rows.length === 0) return [];

    const latestDate = rows[0].trade_date;
    return rows
      .filter((r) => r.trade_date === latestDate)
      .map((r) => ({ sector: r.sector, value: Number(r.volume_jo) }));
  }

  // KOFIA '유통시장 > 실시간 체결정보 > 일자별 거래현황'의 전영업일 회사채 거래를
  // 발행자 기준으로 집계해 Supabase에 저장해둔 것을 읽어온다 (매매금액 단위: 억원).
  async function fetchTopTrades() {
    const url = `${SUPABASE_URL}/rest/v1/top_trades?select=issuer,rating,amount_eok,trade_count&order=trade_date.desc,amount_eok.desc&limit=5`;
    const res = await fetch(url, {
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
      },
    });

    if (!res.ok) {
      throw new Error(`Supabase 조회 실패: ${res.status}`);
    }

    return res.json();
  }

  // KOFIA '신용평가정보 > 신용등급 속보(변동사항만)'을 Supabase에 저장해둔 것을 읽어온다.
  // 이 값은 KOFIA가 신용평가 3사로부터 받아 공개 게시하는 속보이며, 변동이 발생한 건의
  // '현재' 등급/전망만 제공한다 (KOFIA 데이터에 '이전' 등급은 포함되어 있지 않음).
  function daysAgoIsoDate(days) {
    const d = new Date();
    d.setDate(d.getDate() - days);
    return d.toISOString().slice(0, 10);
  }

  async function fetchCreditEvents() {
    const since = daysAgoIsoDate(7);
    const url = `${SUPABASE_URL}/rest/v1/credit_events?select=company_nm,agency,rating,outlook,bond_series,estimate_day,report_url&estimate_day=gte.${since}&order=estimate_day.desc`;
    const res = await fetch(url, {
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
      },
    });

    if (!res.ok) {
      throw new Error(`Supabase 조회 실패: ${res.status}`);
    }

    const rows = await res.json();

    // 회사 하나당 가장 최신 이벤트 1건만 남긴다 (estimate_day desc로 정렬돼 있으므로 처음 등장하는 것을 채택)
    const seen = new Set();
    const latestPerCompany = [];
    for (const row of rows) {
      if (seen.has(row.company_nm)) continue;
      seen.add(row.company_nm);
      latestPerCompany.push(row);
    }

    return latestPerCompany;
  }

  // 네이버 증권 '리서치 > 채권분석'의 최근 2일 자료를 읽어온다 (제목/증권사/날짜/원문 링크만 — 저작권 보호를 위해 본문은 저장하지 않음).
  async function fetchInvestmentOpinions() {
    const url = `${SUPABASE_URL}/rest/v1/investment_opinions?select=title,broker_name,write_date,url&order=write_date.desc`;
    const res = await fetch(url, {
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` },
    });
    if (!res.ok) throw new Error(`Supabase 조회 실패: ${res.status}`);
    return res.json();
  }

  function renderRateCards(rates) {
    const container = document.getElementById('rate-cards');
    container.innerHTML = '';
    rates.forEach((item) => {
      const card = document.createElement('div');
      card.className = 'rate-card';

      const dir = item.changeBp > 0 ? 'up' : item.changeBp < 0 ? 'down' : 'flat';
      const sign = item.changeBp > 0 ? '+' : '';

      card.innerHTML = `
        <div class="tenor">${item.tenor}</div>
        <div class="value">${item.rate.toFixed(2)}%</div>
        <div class="change ${dir}">${sign}${item.changeBp.toFixed(1)}bp</div>
      `;
      container.appendChild(card);
    });
  }

  function renderTopTrades(rows) {
    const body = document.getElementById('top-trades-body');
    body.innerHTML = '';

    if (rows.length === 0) {
      body.innerHTML = '<tr><td colspan="4" style="color:#6b778c;">데이터가 없습니다.</td></tr>';
      return;
    }

    rows.forEach((row) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${row.issuer}</td>
        <td>${row.rating || '-'}</td>
        <td class="num">${Number(row.amount_eok).toLocaleString('ko-KR')}</td>
        <td class="num">${row.trade_count}</td>
      `;
      body.appendChild(tr);
    });
  }

  function renderCreditEvents(events) {
    const container = document.getElementById('credit-events');
    container.innerHTML = '';

    if (events.length === 0) {
      container.innerHTML = '<div style="color:#6b778c;font-size:13px;">최근 7일간 등급/전망 변동 건이 없습니다.</div>';
      return;
    }

    events.forEach((ev) => {
      const div = document.createElement('div');
      div.className = 'event-item';
      const ratingText = ev.rating ? `등급 ${ev.rating}` : '';
      const outlookText = ev.outlook ? `전망 ${ev.outlook}` : '';
      const detail = [ratingText, outlookText].filter(Boolean).join(' · ');
      const reportLink = ev.report_url ? ` · <a href="${ev.report_url}" target="_blank" rel="noopener">평가보고서</a>` : '';
      div.innerHTML = `
        <div class="issuer">${ev.company_nm}</div>
        <div class="meta">${ev.agency} · ${ev.estimate_day}${reportLink}</div>
        <span class="tag down">등급/전망 변동</span>
        <span>${detail}</span>
      `;
      container.appendChild(div);
    });
  }

  function renderInvestmentOpinions(opinions) {
    const container = document.getElementById('investment-opinions');
    container.innerHTML = '';

    if (opinions.length === 0) {
      container.innerHTML = '<div style="color:#6b778c;font-size:13px;">최근 2일간 등록된 채권분석 리서치가 없습니다.</div>';
      return;
    }

    opinions.forEach((op) => {
      const div = document.createElement('div');
      div.className = 'opinion-item';
      div.innerHTML = `
        <div class="title"><a href="${op.url}" target="_blank" rel="noopener">${op.title}</a></div>
        <div class="meta">${op.broker_name} · ${op.write_date}</div>
      `;
      container.appendChild(div);
    });
  }

  let spreadChart;
  let spreadDates = [];
  let spreadDatasets = { sector: [], grade: [], period: [] };

  function buildSpreadChart(mode) {
    const ctx = document.getElementById('spread-chart');
    const series = spreadDatasets[mode];

    const datasets = series.map((s) => ({
      label: s.name,
      data: s.data,
      borderColor: s.color,
      backgroundColor: s.color,
      tension: 0.3,
      pointRadius: 2,
      spanGaps: true,
    }));

    if (spreadChart) {
      spreadChart.data.labels = spreadDates;
      spreadChart.data.datasets = datasets;
      spreadChart.update();
      return;
    }

    spreadChart = new Chart(ctx, {
      type: 'line',
      data: { labels: spreadDates, datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        scales: {
          y: {
            title: { display: true, text: 'bp' },
          },
        },
      },
    });
  }

  function renderVolumeChart(sectorVolume) {
    const ctx = document.getElementById('volume-chart');
    new Chart(ctx, {
      type: 'bar',
      data: {
        labels: sectorVolume.map((s) => s.sector),
        datasets: [{
          label: '유통 물량(조원)',
          data: sectorVolume.map((s) => s.value),
          backgroundColor: '#2563eb',
          borderRadius: 4,
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          y: { title: { display: true, text: '조원' } },
        },
      },
    });
  }

  document.getElementById('spread-tabs').addEventListener('click', (e) => {
    const btn = e.target.closest('.tab-btn');
    if (!btn) return;
    document.querySelectorAll('#spread-tabs .tab-btn').forEach((b) => b.classList.remove('active'));
    btn.classList.add('active');
    buildSpreadChart(btn.dataset.mode);
  });

  document.getElementById('rate-cards').innerHTML = '<div style="color:#6b778c;font-size:13px;">국고채 금리를 불러오는 중...</div>';
  fetchFinalQuoteRates()
    .then((rates) => renderRateCards(rates))
    .catch((err) => {
      console.error(err);
      document.getElementById('rate-cards').innerHTML = '<div style="color:#d64545;font-size:13px;">국고채 금리를 불러오지 못했습니다.</div>';
    });

  document.getElementById('top-trades-body').innerHTML = '<tr><td colspan="4" style="color:#6b778c;">불러오는 중...</td></tr>';
  fetchTopTrades()
    .then((rows) => renderTopTrades(rows))
    .catch((err) => {
      console.error(err);
      document.getElementById('top-trades-body').innerHTML = '<tr><td colspan="4" style="color:#d64545;">전일 매매 데이터를 불러오지 못했습니다.</td></tr>';
    });

  document.getElementById('credit-events').innerHTML = '<div style="color:#6b778c;font-size:13px;">크레딧 이벤트를 불러오는 중...</div>';
  fetchCreditEvents()
    .then((events) => renderCreditEvents(events))
    .catch((err) => {
      console.error(err);
      document.getElementById('credit-events').innerHTML = '<div style="color:#d64545;font-size:13px;">크레딧 이벤트를 불러오지 못했습니다.</div>';
    });

  document.getElementById('investment-opinions').innerHTML = '<div style="color:#6b778c;font-size:13px;">투자의견을 불러오는 중...</div>';
  fetchInvestmentOpinions()
    .then((opinions) => renderInvestmentOpinions(opinions))
    .catch((err) => {
      console.error(err);
      document.getElementById('investment-opinions').innerHTML = '<div style="color:#d64545;font-size:13px;">투자의견을 불러오지 못했습니다.</div>';
    });

  fetchSpreads()
    .then(({ dates, datasets }) => {
      spreadDates = dates;
      spreadDatasets = datasets;
      buildSpreadChart(document.querySelector('#spread-tabs .tab-btn.active').dataset.mode);
    })
    .catch((err) => console.error(err));

  fetchSectorVolume()
    .then((rows) => renderVolumeChart(rows))
    .catch((err) => console.error(err));
</script>

</body>
</html>
