<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>크레딧 채권 매매 대시보드</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background-color: #f4f5f7;
    color: #172b4d;
  }

  header {
    padding: 20px 32px;
    background-color: #0b1f3a;
    color: #ffffff;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }

  header h1 {
    margin: 0;
    font-size: 20px;
  }

  header .as-of {
    font-size: 13px;
    color: #b7c3d9;
  }

  .date-picker-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    background-color: rgba(255, 255, 255, 0.08);
    border-radius: 6px;
    padding: 6px 10px;
  }

  .date-picker-wrap label {
    font-size: 13px;
    color: #b7c3d9;
  }

  .date-picker-wrap input[type="date"] {
    border: none;
    background: transparent;
    color: #ffffff;
    font-size: 13px;
    font-family: inherit;
  }

  main {
    padding: 24px 32px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .panel {
    background-color: #ffffff;
    border: 1px solid #dfe1e6;
    border-radius: 10px;
    padding: 18px 20px;
  }

  .panel h2 {
    font-size: 15px;
    margin: 0 0 14px 0;
    color: #172b4d;
  }

  .rate-cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }

  .rate-card {
    background-color: #f4f5f7;
    border-radius: 8px;
    padding: 14px 16px;
  }

  .rate-card .tenor {
    font-size: 13px;
    color: #44546f;
  }

  .rate-card .value {
    font-size: 24px;
    font-weight: 700;
    margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }

  .rate-card .change {
    font-size: 13px;
    margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }

  .change.up { color: #d64545; }
  .change.down { color: #2563eb; }
  .change.flat { color: #6b778c; }

  .grid-2 {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 20px;
    align-items: start;
  }

  .col {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .tab-row {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }

  .tab-btn {
    border: 1px solid #dfe1e6;
    background-color: #ffffff;
    border-radius: 6px;
    padding: 6px 14px;
    font-size: 13px;
    cursor: pointer;
    color: #44546f;
  }

  .tab-btn.active {
    background-color: #0b1f3a;
    border-color: #0b1f3a;
    color: #ffffff;
  }

  .filter-group {
    margin-bottom: 10px;
  }

  .filter-label {
    font-size: 12px;
    color: #6b778c;
    margin-bottom: 6px;
  }

  .pill-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .pill-btn {
    border: 1px solid #dfe1e6;
    background-color: #ffffff;
    border-radius: 14px;
    padding: 4px 12px;
    font-size: 12px;
    cursor: pointer;
    color: #44546f;
  }

  .pill-btn.active {
    background-color: #e6f0ff;
    border-color: #2563eb;
    color: #0b1f3a;
    font-weight: 600;
  }

  .chart-wrap {
    position: relative;
    height: 280px;
  }

  .chart-wrap.short {
    height: 220px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  th, td {
    text-align: left;
    padding: 8px 6px;
    border-bottom: 1px solid #ebecf0;
  }

  th {
    color: #6b778c;
    font-weight: 600;
    font-size: 12px;
  }

  td.num {
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .event-list, .opinion-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .event-item, .opinion-item {
    padding: 10px 12px;
    background-color: #f4f5f7;
    border-radius: 8px;
    font-size: 13px;
  }

  .event-item .issuer, .opinion-item .title {
    font-weight: 600;
    margin-bottom: 4px;
  }

  .event-item .meta, .opinion-item .meta {
    color: #6b778c;
    font-size: 12px;
    margin-bottom: 4px;
  }

  .tag {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    margin-right: 6px;
  }

  .tag.up { background-color: #ffebe6; color: #d64545; }
  .tag.down { background-color: #e6f0ff; color: #2563eb; }

  @media (max-width: 960px) {
    .grid-2 {
      grid-template-columns: 1fr;
    }
    .rate-cards {
      grid-template-columns: repeat(2, 1fr);
    }
  }
</style>
</head>
<body>

<header>
  <h1>크레딧 채권 매매 대시보드</h1>
  <div class="date-picker-wrap">
    <label for="as-of-date">기준일</label>
    <input type="date" id="as-of-date">
  </div>
</header>

<main>

  <section class="panel">
    <h2>국고채 최종호가수익률</h2>
    <div class="rate-cards" id="rate-cards"></div>
  </section>

  <div class="grid-2">
    <div class="col">
      <section class="panel">
        <h2>스프레드 추이</h2>
        <div class="filter-group">
          <div class="filter-label">유형</div>
          <div class="pill-row" id="filter-sector">
            <button class="pill-btn" data-value="공사채">공사채</button>
            <button class="pill-btn" data-value="은행채">은행채</button>
            <button class="pill-btn" data-value="여전채">여전채</button>
            <button class="pill-btn" data-value="회사채">회사채</button>
          </div>
        </div>
        <div class="filter-group">
          <div class="filter-label">등급</div>
          <div class="pill-row" id="filter-grade"></div>
        </div>
        <div class="filter-group">
          <div class="filter-label">만기</div>
          <div class="pill-row" id="filter-maturity">
            <button class="pill-btn" data-value="3개월">3개월</button>
            <button class="pill-btn" data-value="6개월">6개월</button>
            <button class="pill-btn" data-value="1년 이내">1년 이내</button>
            <button class="pill-btn" data-value="1년~1.5년">1년~1.5년</button>
            <button class="pill-btn" data-value="1.5년~2년">1.5년~2년</button>
            <button class="pill-btn" data-value="2년~2.5년">2년~2.5년</button>
            <button class="pill-btn" data-value="2.5년~3년">2.5년~3년</button>
            <button class="pill-btn" data-value="3년~5년">3년~5년</button>
            <button class="pill-btn" data-value="5년 초과">5년 초과</button>
          </div>
        </div>
        <div class="chart-wrap">
          <canvas id="spread-chart"></canvas>
        </div>
        <div id="spread-empty-msg" style="display:none;color:#6b778c;font-size:13px;margin-top:8px;">선택한 조건에 해당하는 데이터가 없습니다.</div>
      </section>

      <section class="panel">
        <h2>섹터별 유통 물량</h2>
        <div class="filter-group">
          <div class="filter-label">유형</div>
          <div class="pill-row" id="vol-filter-sector">
            <button class="pill-btn" data-value="공사채">공사채</button>
            <button class="pill-btn" data-value="은행채">은행채</button>
            <button class="pill-btn" data-value="여전채">여전채</button>
            <button class="pill-btn" data-value="회사채">회사채</button>
          </div>
        </div>
        <div class="filter-group">
          <div class="filter-label">등급</div>
          <div class="pill-row" id="vol-filter-grade"></div>
        </div>
        <div class="filter-group">
          <div class="filter-label">만기</div>
          <div class="pill-row" id="vol-filter-maturity">
            <button class="pill-btn" data-value="3개월">3개월</button>
            <button class="pill-btn" data-value="6개월">6개월</button>
            <button class="pill-btn" data-value="1년 이내">1년 이내</button>
            <button class="pill-btn" data-value="1년~1.5년">1년~1.5년</button>
            <button class="pill-btn" data-value="1.5년~2년">1.5년~2년</button>
            <button class="pill-btn" data-value="2년~2.5년">2년~2.5년</button>
            <button class="pill-btn" data-value="2.5년~3년">2.5년~3년</button>
            <button class="pill-btn" data-value="3년~5년">3년~5년</button>
            <button class="pill-btn" data-value="5년 초과">5년 초과</button>
          </div>
        </div>
        <div class="chart-wrap short">
          <canvas id="volume-chart"></canvas>
        </div>
        <div id="volume-empty-msg" style="display:none;color:#6b778c;font-size:13px;margin-top:8px;">선택한 조건에 해당하는 데이터가 없습니다.</div>
      </section>
    </div>

    <div class="col">
      <section class="panel">
        <h2>전일 크레딧 매매 Top 5 (발행자 기준)</h2>
        <table>
          <thead>
            <tr>
              <th>발행자</th>
              <th>등급</th>
              <th class="num">매매금액(억원)</th>
              <th class="num">건수</th>
            </tr>
          </thead>
          <tbody id="top-trades-body"></tbody>
        </table>
      </section>

      <section class="panel">
        <h2>크레딧 이벤트</h2>
        <div class="event-list" id="credit-events"></div>
      </section>

      <section class="panel">
        <h2>주요 투자의견</h2>
        <div class="opinion-list" id="investment-opinions"></div>
      </section>
    </div>
  </div>

</main>

<script>
  // Supabase anon key는 Row Level Security(읽기 전용 정책)로 보호되므로 클라이언트 코드에 그대로 둡니다.
  // 쓰기 권한이 있는 service_role 키는 절대 여기에 넣지 않습니다 (scripts/collect-kofia.mjs 쪽 .env에서만 사용).
  const SUPABASE_URL = 'https://yhawlnfynxtbschjbzac.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InloYXdsbmZ5bnh0YnNjaGpiemFjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxNDQyODAsImV4cCI6MjEwNTcyMDI4MH0.3aGHs4yxtCxtnsN0b4-wtNWS71bZQVJeJ_fv-te-JNI';

  const TENOR_ORDER = ['국고채 3년', '국고채 5년', '국고채 10년', '국고채 30년'];

  async function fetchFinalQuoteRates(date) {
    // 종목별 최종호가일자가 서로 다를 수 있어(유동성 낮은 만기는 며칠 전 값일 수 있음),
    // 선택한 기준일 이하 중 각 만기별로 가장 최근 값을 쓴다.
    const url = `${SUPABASE_URL}/rest/v1/kofia_rates?select=tenor,rate,change_bp,as_of_date&as_of_date=lte.${date}&order=as_of_date.desc`;
    const res = await fetch(url, {
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
      },
    });

    if (!res.ok) {
      throw new Error(`Supabase 조회 실패: ${res.status}`);
    }

    const rows = await res.json();
    const byTenor = {};
    for (const r of rows) {
      if (!byTenor[r.tenor]) byTenor[r.tenor] = r;
    }

    return TENOR_ORDER.filter((t) => byTenor[t]).map((t) => ({
      tenor: t,
      rate: Number(byTenor[t].rate),
      changeBp: Number(byTenor[t].change_bp),
    }));
  }

  // KOFIA '일자별 거래현황'(Top5 매매와 동일 소스)에서 계산한, 유형(공사채/은행채/여전채/회사채) x 등급 x 만기구간
  // 조합별 국고채 대비 스프레드(최근 7영업일)를 읽어온다. 유형은 항상 선택된 것마다 별도의 선으로 그리고,
  // 등급/만기는 각 유형 선의 데이터를 좁히는 필터로만 쓴다(선이 늘어나지 않음).
  const SECTOR_TYPES = ['공사채', '은행채', '여전채', '회사채'];
  const SECTOR_COLORS = { '공사채': '#2563eb', '은행채': '#059669', '여전채': '#d97706', '회사채': '#dc2626' };
  const GRADE_ORDER = ['AAA', 'AA+', 'AA', 'AA0', 'AA-', 'A+', 'A', 'A0', 'A-', 'BBB+', 'BBB', 'BBB0', 'BBB-', '무등급'];

  let spreadCells = []; // { trade_date, sector, grade, maturity_bucket, spread_bp, trade_count }
  const spreadFilter = { sectors: new Set(SECTOR_TYPES), grades: new Set(), maturities: new Set() };

  async function fetchSpreadCells(date) {
    const url = `${SUPABASE_URL}/rest/v1/spread_cells?select=trade_date,sector,grade,maturity_bucket,spread_bp,trade_count&trade_date=lte.${date}&order=trade_date.desc`;
    const res = await fetch(url, {
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` },
    });
    if (!res.ok) throw new Error(`Supabase 조회 실패: ${res.status}`);
    const rows = await res.json();

    // 기준일 이전(포함) 중 가장 최근 7영업일치만 사용
    const recentDates = new Set(Array.from(new Set(rows.map((r) => r.trade_date))).slice(0, 7));
    return rows.filter((r) => recentDates.has(r.trade_date));
  }

  function buildSpreadDatasetsFromCells(cells, filter) {
    const dates = Array.from(new Set(cells.map((c) => c.trade_date))).sort();

    const datasets = Array.from(filter.sectors).sort((a, b) => SECTOR_TYPES.indexOf(a) - SECTOR_TYPES.indexOf(b)).map((sector) => {
      const byDate = new Map();
      for (const d of dates) byDate.set(d, { sum: 0, weight: 0 });

      for (const c of cells) {
        if (c.sector !== sector) continue;
        if (filter.grades.size > 0 && !filter.grades.has(c.grade)) continue;
        if (filter.maturities.size > 0 && !filter.maturities.has(c.maturity_bucket)) continue;
        const acc = byDate.get(c.trade_date);
        acc.sum += Number(c.spread_bp) * c.trade_count;
        acc.weight += c.trade_count;
      }

      const data = dates.map((d) => {
        const acc = byDate.get(d);
        return acc.weight > 0 ? Math.round((acc.sum / acc.weight) * 10) / 10 : null;
      });

      return { name: sector, color: SECTOR_COLORS[sector], data };
    });

    return { dates: dates.map((d) => d.slice(5).replace('-', '/')), datasets };
  }

  // KOFIA '일자별 거래현황'에서 집계한, 유형(공사채/은행채/여전채/회사채) x 등급 x 만기구간 조합별
  // 전영업일 유통 물량을 읽어온다 (단위: 조원). 스프레드 추이와 같은 방식: 유형은 항상 막대 하나씩,
  // 등급/만기는 필터.
  const volumeFilter = { sectors: new Set(SECTOR_TYPES), grades: new Set(), maturities: new Set() };
  let volumeCells = [];

  async function fetchVolumeCells(date) {
    const url = `${SUPABASE_URL}/rest/v1/volume_cells?select=trade_date,sector,grade,maturity_bucket,volume_jo&trade_date=lte.${date}&order=trade_date.desc`;
    const res = await fetch(url, {
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` },
    });
    if (!res.ok) throw new Error(`Supabase 조회 실패: ${res.status}`);
    const rows = await res.json();
    if (rows.length === 0) return [];
    const latestDate = rows[0].trade_date;
    return rows.filter((r) => r.trade_date === latestDate);
  }

  function buildVolumeDataFromCells(cells, filter) {
    return Array.from(filter.sectors).sort((a, b) => SECTOR_TYPES.indexOf(a) - SECTOR_TYPES.indexOf(b)).map((sector) => {
      let sum = 0;
      for (const c of cells) {
        if (c.sector !== sector) continue;
        if (filter.grades.size > 0 && !filter.grades.has(c.grade)) continue;
        if (filter.maturities.size > 0 && !filter.maturities.has(c.maturity_bucket)) continue;
        sum += Number(c.volume_jo);
      }
      return { sector, value: Math.round(sum * 1000) / 1000 };
    });
  }

  // KOFIA '유통시장 > 실시간 체결정보 > 일자별 거래현황'의 전영업일 회사채 거래를
  // 발행자 기준으로 집계해 Supabase에 저장해둔 것을 읽어온다 (매매금액 단위: 억원).
  async function fetchTopTrades(date) {
    const url = `${SUPABASE_URL}/rest/v1/top_trades?select=trade_date,issuer,rating,amount_eok,trade_count&trade_date=lte.${date}&order=trade_date.desc,amount_eok.desc&limit=200`;
    const res = await fetch(url, {
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
      },
    });

    if (!res.ok) {
      throw new Error(`Supabase 조회 실패: ${res.status}`);
    }

    const rows = await res.json();
    if (rows.length === 0) return [];
    const latestDate = rows[0].trade_date;
    return rows.filter((r) => r.trade_date === latestDate).slice(0, 5);
  }

  // KOFIA '신용평가정보 > 신용등급 속보(변동사항만)'을 Supabase에 저장해둔 것을 읽어온다.
  // 이 값은 KOFIA가 신용평가 3사로부터 받아 공개 게시하는 속보이며, 변동이 발생한 건의
  // '현재' 등급/전망만 제공한다 (KOFIA 데이터에 '이전' 등급은 포함되어 있지 않음).
  function isoDaysBefore(isoDate, days) {
    const d = new Date(`${isoDate}T00:00:00Z`);
    d.setUTCDate(d.getUTCDate() - days);
    return d.toISOString().slice(0, 10);
  }

  async function fetchCreditEvents(date) {
    const since = isoDaysBefore(date, 6);
    const url = `${SUPABASE_URL}/rest/v1/credit_events?select=company_nm,agency,rating,outlook,bond_series,estimate_day,report_url&estimate_day=gte.${since}&estimate_day=lte.${date}&order=estimate_day.desc`;
    const res = await fetch(url, {
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
      },
    });

    if (!res.ok) {
      throw new Error(`Supabase 조회 실패: ${res.status}`);
    }

    const rows = await res.json();

    // 회사 하나당 가장 최신 이벤트 1건만 남긴다 (estimate_day desc로 정렬돼 있으므로 처음 등장하는 것을 채택)
    const seen = new Set();
    const latestPerCompany = [];
    for (const row of rows) {
      if (seen.has(row.company_nm)) continue;
      seen.add(row.company_nm);
      latestPerCompany.push(row);
    }

    return latestPerCompany;
  }

  // 네이버 증권 '리서치 > 채권분석'의 최근 2일 리포트 원문을 Gemini로 요약한 3꼭지 시황 의견을 읽어온다.
  async function fetchInvestmentOpinions(date) {
    const url = `${SUPABASE_URL}/rest/v1/market_opinion_summary?select=summary_date,point_order,heading,body,sources&summary_date=lte.${date}&order=summary_date.desc,point_order.asc&limit=3`;
    const res = await fetch(url, {
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` },
    });
    if (!res.ok) throw new Error(`Supabase 조회 실패: ${res.status}`);
    const rows = await res.json();
    if (rows.length === 0) return { date: null, points: [] };
    return { date: rows[0].summary_date, points: rows };
  }

  function renderRateCards(rates) {
    const container = document.getElementById('rate-cards');
    container.innerHTML = '';
    rates.forEach((item) => {
      const card = document.createElement('div');
      card.className = 'rate-card';

      const dir = item.changeBp > 0 ? 'up' : item.changeBp < 0 ? 'down' : 'flat';
      const sign = item.changeBp > 0 ? '+' : '';

      card.innerHTML = `
        <div class="tenor">${item.tenor}</div>
        <div class="value">${item.rate.toFixed(2)}%</div>
        <div class="change ${dir}">${sign}${item.changeBp.toFixed(1)}bp</div>
      `;
      container.appendChild(card);
    });
  }

  function renderTopTrades(rows) {
    const body = document.getElementById('top-trades-body');
    body.innerHTML = '';

    if (rows.length === 0) {
      body.innerHTML = '<tr><td colspan="4" style="color:#6b778c;">데이터가 없습니다.</td></tr>';
      return;
    }

    rows.forEach((row) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${row.issuer}</td>
        <td>${row.rating || '-'}</td>
        <td class="num">${Number(row.amount_eok).toLocaleString('ko-KR')}</td>
        <td class="num">${row.trade_count}</td>
      `;
      body.appendChild(tr);
    });
  }

  function renderCreditEvents(events) {
    const container = document.getElementById('credit-events');
    container.innerHTML = '';

    if (events.length === 0) {
      container.innerHTML = '<div style="color:#6b778c;font-size:13px;">최근 7일간 등급/전망 변동 건이 없습니다.</div>';
      return;
    }

    events.forEach((ev) => {
      const div = document.createElement('div');
      div.className = 'event-item';
      const ratingText = ev.rating ? `등급 ${ev.rating}` : '';
      const outlookText = ev.outlook ? `전망 ${ev.outlook}` : '';
      const detail = [ratingText, outlookText].filter(Boolean).join(' · ');
      const reportLink = ev.report_url ? ` · <a href="${ev.report_url}" target="_blank" rel="noopener">평가보고서</a>` : '';
      div.innerHTML = `
        <div class="issuer">${ev.company_nm}</div>
        <div class="meta">${ev.agency} · ${ev.estimate_day}${reportLink}</div>
        <span class="tag down">등급/전망 변동</span>
        <span>${detail}</span>
      `;
      container.appendChild(div);
    });
  }

  function renderInvestmentOpinions({ date, points }) {
    const container = document.getElementById('investment-opinions');
    container.innerHTML = '';

    if (points.length === 0) {
      container.innerHTML = '<div style="color:#6b778c;font-size:13px;">아직 생성된 요약이 없습니다.</div>';
      return;
    }

    points.forEach((p) => {
      const div = document.createElement('div');
      div.className = 'opinion-item';
      div.innerHTML = `
        <div class="title">${p.point_order}. ${p.heading}</div>
        <div class="meta">AI 요약(Gemini) · ${date}</div>
        <div>${p.body}</div>
      `;
      container.appendChild(div);
    });
  }

  let spreadChart;

  function renderSpreadChart() {
    const { dates, datasets: series } = buildSpreadDatasetsFromCells(spreadCells, spreadFilter);
    const ctx = document.getElementById('spread-chart');

    const hasAnyData = series.some((s) => s.data.some((v) => v !== null));
    document.getElementById('spread-empty-msg').style.display = hasAnyData ? 'none' : 'block';

    const datasets = series.map((s) => ({
      label: s.name,
      data: s.data,
      borderColor: s.color,
      backgroundColor: s.color,
      tension: 0.3,
      pointRadius: 2,
      spanGaps: true,
    }));

    if (spreadChart) {
      spreadChart.data.labels = dates;
      spreadChart.data.datasets = datasets;
      spreadChart.update();
      return;
    }

    spreadChart = new Chart(ctx, {
      type: 'line',
      data: { labels: dates, datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        scales: {
          y: {
            title: { display: true, text: 'bp' },
          },
        },
      },
    });
  }

  let volumeChart;

  function renderVolumeChart() {
    const data = buildVolumeDataFromCells(volumeCells, volumeFilter);
    const ctx = document.getElementById('volume-chart');

    const hasAnyData = data.some((s) => s.value > 0);
    document.getElementById('volume-empty-msg').style.display = hasAnyData ? 'none' : 'block';

    const labels = data.map((s) => s.sector);
    const values = data.map((s) => s.value);
    const colors = data.map((s) => SECTOR_COLORS[s.sector]);

    if (volumeChart) {
      volumeChart.data.labels = labels;
      volumeChart.data.datasets[0].data = values;
      volumeChart.data.datasets[0].backgroundColor = colors;
      volumeChart.update();
      return;
    }

    volumeChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels,
        datasets: [{
          label: '유통 물량(조원)',
          data: values,
          backgroundColor: colors,
          borderRadius: 4,
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          y: { title: { display: true, text: '조원' } },
        },
      },
    });
  }

  function wireFilterPills(containerId, filterSet, onChange) {
    document.getElementById(containerId).addEventListener('click', (e) => {
      const btn = e.target.closest('.pill-btn');
      if (!btn) return;
      const value = btn.dataset.value;
      if (filterSet.has(value)) {
        filterSet.delete(value);
        btn.classList.remove('active');
      } else {
        filterSet.add(value);
        btn.classList.add('active');
      }
      onChange();
    });
  }

  wireFilterPills('filter-sector', spreadFilter.sectors, renderSpreadChart);
  wireFilterPills('filter-maturity', spreadFilter.maturities, renderSpreadChart);
  wireFilterPills('filter-grade', spreadFilter.grades, renderSpreadChart);
  wireFilterPills('vol-filter-sector', volumeFilter.sectors, renderVolumeChart);
  wireFilterPills('vol-filter-maturity', volumeFilter.maturities, renderVolumeChart);
  wireFilterPills('vol-filter-grade', volumeFilter.grades, renderVolumeChart);

  document.querySelectorAll('#filter-sector .pill-btn, #vol-filter-sector .pill-btn').forEach((btn) => {
    btn.classList.add('active');
  });

  // 등급 목록은 선택된 기준일의 데이터에 따라 달라지므로, 필터 값(Set)은 유지한 채 버튼만 다시 그린다.
  // 이벤트 리스너는 위에서 컨테이너에 한 번만(이벤트 위임) 걸어뒀으므로 여기서는 다시 걸지 않는다.
  function populateGradeFilter(containerId, cells, filterSet) {
    const found = Array.from(new Set(cells.map((c) => c.grade)));
    found.sort((a, b) => {
      const ia = GRADE_ORDER.indexOf(a);
      const ib = GRADE_ORDER.indexOf(b);
      if (ia === -1 && ib === -1) return a.localeCompare(b);
      if (ia === -1) return 1;
      if (ib === -1) return -1;
      return ia - ib;
    });

    const container = document.getElementById(containerId);
    container.innerHTML = '';
    found.forEach((grade) => {
      const btn = document.createElement('button');
      btn.className = 'pill-btn' + (filterSet.has(grade) ? ' active' : '');
      btn.dataset.value = grade;
      btn.textContent = grade;
      container.appendChild(btn);
    });
  }

  // 기준일 하나로 대시보드 전체(금리·Top5·크레딧이벤트·스프레드·유통물량·투자의견)를 다시 불러온다.
  function loadDashboard(date) {
    document.getElementById('rate-cards').innerHTML = '<div style="color:#6b778c;font-size:13px;">국고채 금리를 불러오는 중...</div>';
    fetchFinalQuoteRates(date)
      .then((rates) => renderRateCards(rates))
      .catch((err) => {
        console.error(err);
        document.getElementById('rate-cards').innerHTML = '<div style="color:#d64545;font-size:13px;">국고채 금리를 불러오지 못했습니다.</div>';
      });

    document.getElementById('top-trades-body').innerHTML = '<tr><td colspan="4" style="color:#6b778c;">불러오는 중...</td></tr>';
    fetchTopTrades(date)
      .then((rows) => renderTopTrades(rows))
      .catch((err) => {
        console.error(err);
        document.getElementById('top-trades-body').innerHTML = '<tr><td colspan="4" style="color:#d64545;">전일 매매 데이터를 불러오지 못했습니다.</td></tr>';
      });

    document.getElementById('credit-events').innerHTML = '<div style="color:#6b778c;font-size:13px;">크레딧 이벤트를 불러오는 중...</div>';
    fetchCreditEvents(date)
      .then((events) => renderCreditEvents(events))
      .catch((err) => {
        console.error(err);
        document.getElementById('credit-events').innerHTML = '<div style="color:#d64545;font-size:13px;">크레딧 이벤트를 불러오지 못했습니다.</div>';
      });

    document.getElementById('investment-opinions').innerHTML = '<div style="color:#6b778c;font-size:13px;">투자의견을 불러오는 중...</div>';
    fetchInvestmentOpinions(date)
      .then((opinions) => renderInvestmentOpinions(opinions))
      .catch((err) => {
        console.error(err);
        document.getElementById('investment-opinions').innerHTML = '<div style="color:#d64545;font-size:13px;">투자의견을 불러오지 못했습니다.</div>';
      });

    fetchSpreadCells(date)
      .then((cells) => {
        spreadCells = cells;
        populateGradeFilter('filter-grade', cells, spreadFilter.grades);
        renderSpreadChart();
      })
      .catch((err) => console.error(err));

    fetchVolumeCells(date)
      .then((cells) => {
        volumeCells = cells;
        populateGradeFilter('vol-filter-grade', cells, volumeFilter.grades);
        renderVolumeChart();
      })
      .catch((err) => console.error(err));
  }

  const dateInput = document.getElementById('as-of-date');
  dateInput.addEventListener('change', () => {
    if (dateInput.value) loadDashboard(dateInput.value);
  });

  // 기본 기준일 = spread_cells의 가장 최근 거래일
  fetch(`${SUPABASE_URL}/rest/v1/spread_cells?select=trade_date&order=trade_date.desc&limit=1`, {
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` },
  })
    .then((res) => res.json())
    .then((rows) => {
      const defaultDate = rows[0]?.trade_date || new Date().toISOString().slice(0, 10);
      dateInput.value = defaultDate;
      dateInput.max = defaultDate;
      loadDashboard(defaultDate);
    })
    .catch((err) => {
      console.error(err);
      const fallback = new Date().toISOString().slice(0, 10);
      dateInput.value = fallback;
      loadDashboard(fallback);
    });
</script>

</body>
</html>
